server:
  port: 8001

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rotation_db
    username: admin
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123

jwt:
  secret: my-jwt-secret-key-for-rotation-app-2026
  expiration: 86400000
