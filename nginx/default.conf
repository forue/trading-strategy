upstream auth_backend {
    server backend-auth:8001;
}

upstream strategy_backend {
    server backend-strategy:8002;
}

upstream data_collector_backend {
    server backend-data-collector:8003;
}

upstream signal_backend {
    server backend-signal:8004;
}

upstream fund_backend {
    server backend-fund:8005;
}

upstream scheduler_backend {
    server backend-scheduler:8006;
}

server {
    listen 80;
    server_name localhost;

    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 认证中心
    location /api/auth/ {
        proxy_pass http://auth_backend/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 策略引擎 (前端 /api/strategy/* -> 后端 /*)
    location /api/strategy/ {
        proxy_pass http://strategy_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 数据采集 (前端 /api/data/* -> 后端 /*)
    location /api/data/ {
        proxy_pass http://data_collector_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 信号通知 (前端 /api/signals/* -> 后端 /signals/*)
    location /api/signals/ {
        proxy_pass http://signal_backend/signals/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 资金管理 (前端 /api/fund/* -> 后端 /api/fund/*)
    location /api/fund/ {
        proxy_pass http://fund_backend/api/fund/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-User-Id $http_x_user_id;
    }

    # 调度器服务 (前端 /api/scheduler/* -> 后端 /*)
    location /api/scheduler/ {
        proxy_pass http://scheduler_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket信号推送
    location /ws/ {
        proxy_pass http://signal_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Gzip压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
