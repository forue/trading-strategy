server {
    listen 80;
    server_name localhost;

    # Docker 内置 DNS。nginx 对 proxy_pass 中的静态主机名只在启动时解析一次并缓存 IP，
    # 后端容器被重建后会分配新 IP，而 nginx 仍指向旧 IP → 连接被拒(502)，
    # 前端表现为"网络错误/接口不可用"，必须重启 nginx 才能恢复。
    # 这里改用"变量 + resolver"：proxy_pass 使用变量时 nginx 会按 valid 周期重新解析，
    # 容器重建后无需重启 nginx。注意：使用变量后 proxy_pass 不再自动替换 location 前缀，
    # 因此需要保留前缀映射的 location 必须显式 rewrite。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 认证中心（后端路径同样带 /api/auth/ 前缀，URI 原样透传）
    location /api/auth/ {
        set $auth_upstream http://backend-auth:8001;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 策略引擎（寻优可能耗时较长，设置 5 分钟超时）
    location /api/strategy/ {
        set $strategy_upstream http://backend-strategy:8002;
        rewrite ^/api/strategy/(.*)$ /$1 break;
        proxy_pass $strategy_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # 数据采集
    location /api/data/ {
        set $data_upstream http://backend-data-collector:8003;
        rewrite ^/api/data/(.*)$ /$1 break;
        proxy_pass $data_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 信号通知
    location /api/signals/ {
        set $signal_upstream http://backend-signal:8004;
        rewrite ^/api/signals/(.*)$ /signals/$1 break;
        proxy_pass $signal_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 信号通知 - 健康检查
    location = /api/signals/health {
        set $signal_upstream http://backend-signal:8004;
        rewrite ^ /health break;
        proxy_pass $signal_upstream;
        proxy_set_header Host $host;
    }

    # 资金管理（后端路径同样带 /api/fund/ 前缀，URI 原样透传）
    location /api/fund/ {
        set $fund_upstream http://backend-fund:8005;
        proxy_pass $fund_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-User-Id $http_x_user_id;
    }

    # 调度器服务
    location /api/scheduler/ {
        set $scheduler_upstream http://backend-scheduler:8006;
        rewrite ^/api/scheduler/(.*)$ /$1 break;
        proxy_pass $scheduler_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # AI 决策服务（后端路径同样带 /api/ai/ 前缀，URI 原样透传）
    location /api/ai/ {
        set $ai_upstream http://backend-ai-decision:8007;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_cache off;
    }

    # AI 决策服务 - 健康检查
    location = /api/ai/health {
        set $ai_upstream http://backend-ai-decision:8007;
        rewrite ^ /health break;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
    }

    # MCP 金融 Agent（后端路径同样带 /api/mcp/ 前缀，URI 原样透传）
    location /api/mcp/ {
        set $mcp_upstream http://backend-mcp:8008;
        proxy_pass $mcp_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # MCP SSE 端点
    location /mcp/ {
        set $mcp_upstream http://backend-mcp:8008;
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # WebSocket信号推送
    location /ws/ {
        set $signal_upstream http://backend-signal:8004;
        proxy_pass $signal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Gzip压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
