services:
  # ==================== 基础设施 ====================
  postgres:
    image: postgres:15
    container_name: rotation-postgres
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: rotation_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d rotation_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rotation-redis
    command: redis-server --requirepass redis123 --appendonly yes
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    container_name: rotation-influxdb
    environment:
      TZ: Asia/Shanghai
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: influx123456
      DOCKER_INFLUXDB_INIT_ORG: rotation
      DOCKER_INFLUXDB_INIT_BUCKET: market_data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-token
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rotation-rabbitmq
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==================== 后端微服务 ====================
  backend-auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: rotation-auth
    ports:
      - "8001:8001"
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rotation_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis123
      JWT_SECRET: my-jwt-secret-key-for-rotation-app-2026
      JWT_EXPIRATION: 86400000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-data-collector:
    build:
      context: ./services/data-collector
      dockerfile: Dockerfile
    container_name: rotation-data-collector
    ports:
      - "8003:8003"
    environment:
      TZ: Asia/Shanghai
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: my-super-secret-token
      INFLUXDB_ORG: rotation
      INFLUXDB_BUCKET: market_data
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  backend-strategy:
    build:
      context: ./services/strategy
      dockerfile: Dockerfile
    container_name: rotation-strategy
    ports:
      - "8002:8002"
    environment:
      TZ: Asia/Shanghai
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: my-super-secret-token
      INFLUXDB_ORG: rotation
      INFLUXDB_BUCKET: market_data
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  backend-signal:
    build:
      context: ./services/signal-notification
      dockerfile: Dockerfile
    container_name: rotation-signal
    ports:
      - "8004:8004"
    environment:
      TZ: Asia/Shanghai
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      # 钉钉推送（可选，也可在页面配置）
      DINGTALK_ENABLED: "false"
      DINGTALK_WEBHOOK_URL: ""
      DINGTALK_SECRET: ""
      # 企业微信推送（可选，也可在页面配置）
      WECOM_ENABLED: "false"
      WECOM_WEBHOOK_URL: ""
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  backend-fund:
    build:
      context: ./services/fund-management
      dockerfile: Dockerfile
    container_name: rotation-fund
    ports:
      - "8005:8005"
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rotation_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: redis123
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: my-super-secret-token
      INFLUXDB_ORG: rotation
      INFLUXDB_BUCKET: market_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  backend-scheduler:
    build:
      context: ./services/scheduler
      dockerfile: Dockerfile
    container_name: rotation-scheduler
    ports:
      - "8006:8006"
    environment:
      TZ: Asia/Shanghai
      DATA_COLLECTOR_URL: http://backend-data-collector:8003
      STRATEGY_URL: http://backend-strategy:8002
      SIGNAL_URL: http://backend-signal:8004

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      - backend-data-collector
      - backend-strategy
      - backend-signal

  # ==================== 前端 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rotation-frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-auth
      - backend-strategy
      - backend-signal
      - backend-fund

volumes:
  pg_data:
  redis_data:
  influxdb_data:
  rabbitmq_data:
